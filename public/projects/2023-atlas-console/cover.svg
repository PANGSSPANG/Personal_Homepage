<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Atlas operations console</title>
  <desc id="desc">An abstract console interface with a form, a table and an audit log panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eadc"/>
      <stop offset="1" stop-color="#e3d5c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#5b4636" font-family="Georgia, 'Times New Roman', serif">
    <text x="72" y="112" font-size="22" letter-spacing="7" opacity="0.6">CASE STUDY 02</text>
    <text x="72" y="212" font-size="78" font-weight="700">Atlas</text>
    <text x="72" y="282" font-size="42" opacity="0.8">Operations console</text>
    <text x="72" y="344" font-size="22" opacity="0.55" font-family="Arial, sans-serif">12 repeated workflows, moved out of tickets.</text>
  </g>
  <g transform="translate(640 150)">
    <rect width="470" height="390" rx="18" fill="#fbf8f1" stroke="#c9b69c"/>
    <rect x="0" y="0" width="470" height="52" rx="18" fill="#e8dcc9"/>
    <circle cx="30" cy="26" r="6" fill="#c2703f"/>
    <circle cx="52" cy="26" r="6" fill="#c9a227"/>
    <circle cx="74" cy="26" r="6" fill="#6f8f5f"/>
    <g font-family="Arial, sans-serif" fill="#5b4636">
      <text x="28" y="98" font-size="15" letter-spacing="2" opacity="0.6">REFUND REQUEST</text>
      <rect x="28" y="114" width="200" height="38" rx="8" fill="#efe5d6"/>
      <text x="42" y="139" font-size="14" opacity="0.65">order_id</text>
      <rect x="244" y="114" width="198" height="38" rx="8" fill="#efe5d6"/>
      <text x="258" y="139" font-size="14" opacity="0.65">amount</text>
      <rect x="28" y="170" width="414" height="78" rx="8" fill="#efe5d6"/>
      <text x="42" y="196" font-size="14" opacity="0.65">reason</text>
      <rect x="28" y="270" width="120" height="34" rx="17" fill="#5b4636"/>
      <text x="52" y="292" font-size="14" fill="#fbf8f1">Submit</text>
      <g opacity="0.7">
        <text x="28" y="344" font-size="13">AUDIT LOG</text>
        <rect x="28" y="356" width="414" height="1" fill="#c9b69c"/>
        <text x="28" y="382" font-size="13">10:24  refund.created  ·  lin</text>
        <text x="28" y="406" font-size="13">10:24  refund.approved ·  ops</text>
      </g>
    </g>
  </g>
  <g fill="#5b4636" font-family="Arial, sans-serif">
    <text x="72" y="566" font-size="18" opacity="0.8">-60% tickets</text>
    <text x="72" y="596" font-size="15" opacity="0.45">12 workflows automated</text>
  </g>
</svg>
